{% extends "base.html" %}


{% block content %}
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">اطلاعات کاربر</h1>
            <p class="lead fw-normal text-white-50 mb-0">برای سفارش اطلاعات خود را تکمیل کنید</p>
        </div>
    </div>
</header>

<div class="container">
    <div class="row">
        <center>
            <div class="col-10">
                <strong>اطلاعات کاربر</strong>
                <br><br>
                <form method="POST" action="{% url "update_info" %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <br><br>
                    <strong>اطلاعت ارسالی</strong>
                    {{ shipping_form.as_p }}

                    <br><br>
                    
                    <button type="submit" class="btn btn-scondary">به روز رسانی</button>
                </form>

            </div>
        </center>
    </div>
</div>

<br>
<br>



{% endblock  %}%
